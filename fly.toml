app = "zentrix-tradingbot"
primary_region = "fra"

[build]

[env]
  SITE_URL = "https://zentrix-tradingbot.fly.dev"
  SECURE_COOKIES = "1"
  ENGINE_ENABLED = "1"
  DATA_DIR = "/data"

[mounts]
  source = "tbdata"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
